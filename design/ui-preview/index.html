<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出港成本分析</title>
<style>
/* Layout: one working column. Scope bar on top, summary before detail, charts then the band × flow table. */
:root{
  --bg:#f3f5f9; --panel:#ffffff; --line:#dfe4ee; --line2:#eef1f6;
  --ink:#16213a; --ink2:#4a5672; --ink3:#8590a8;
  --accent:#1f3d7a; --accent-soft:#e7edf8;
  /* concentration (navy depth) */
  --c-main:#1f3d7a; --c-sub:#6f8fc9; --c-low:#c9d6ee;
  /* cost vs network (semantic, separate from accent) */
  --g2:#1e8a5a; --g1:#bfe5d1; --n0:#f4f6fa; --r1:#f6d0c6; --r2:#c4452b;
  --g2-ink:#ffffff; --r2-ink:#ffffff; --cell-ink:#16213a;
  --warn:#b26b00; --warn-soft:#fff3dc;
  /* cost interval scale (low → high), separate from concentration navy */
  --k1:#1f3d7a; --k2:#c4452b; --k3:#1e8a5a; --k4:#b26b00; --k5:#7a4fb3; --k6:#2b8fb3; --k7:#8a6d3b; --k8:#d14d8b;
  --f1:#1f3d7a; --f2:#3c63a8; --f3:#6f8fc9; --f4:#9db4de; --f5:#c9d6ee; --f6:#7c8aa6;
  --s1:#fbf5ea; --s2:#f5e2bf; --s3:#edc68a; --s4:#de9b55; --s5:#c06a2c; --s5-ink:#ffffff;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  --num:"DIN Alternate","Bahnschrift","DIN Condensed","Roboto Condensed",var(--font);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1524; --panel:#161e31; --line:#283350; --line2:#1d2640;
  --ink:#e6ebf5; --ink2:#a9b4cc; --ink3:#6f7b96;
  --accent:#8fb0ee; --accent-soft:#1f2b48;
  --c-main:#8fb0ee; --c-sub:#4d6aa3; --c-low:#2a3a5f;
  --g2:#2fae75; --g1:#1d4a37; --n0:#1b2338; --r1:#5a2b22; --r2:#e2674c;
  --g2-ink:#06140d; --r2-ink:#1a0703; --cell-ink:#e6ebf5;
  --warn:#f0b04a; --warn-soft:#3a2c12; --k1:#8fb0ee; --k2:#ef7a5f; --k3:#45c28a; --k4:#f0b04a; --k5:#b48ef0; --k6:#5cc3e6; --k7:#cfae74; --k8:#f07ab4; --f1:#b9cdf5; --f2:#8fb0ee; --f3:#6788c9; --f4:#4a68a3; --f5:#344a78; --f6:#6f7b96; --s1:#1d2436; --s2:#3a3424; --s3:#5e4a26; --s4:#8a5e28; --s5:#c27a35; --s5-ink:#140a02; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1524; --panel:#161e31; --line:#283350; --line2:#1d2640;
  --ink:#e6ebf5; --ink2:#a9b4cc; --ink3:#6f7b96;
  --accent:#8fb0ee; --accent-soft:#1f2b48;
  --c-main:#8fb0ee; --c-sub:#4d6aa3; --c-low:#2a3a5f;
  --g2:#2fae75; --g1:#1d4a37; --n0:#1b2338; --r1:#5a2b22; --r2:#e2674c;
  --g2-ink:#06140d; --r2-ink:#1a0703; --cell-ink:#e6ebf5;
  --warn:#f0b04a; --warn-soft:#3a2c12; --k1:#8fb0ee; --k2:#ef7a5f; --k3:#45c28a; --k4:#f0b04a; --k5:#b48ef0; --k6:#5cc3e6; --k7:#cfae74; --k8:#f07ab4; --f1:#b9cdf5; --f2:#8fb0ee; --f3:#6788c9; --f4:#4a68a3; --f5:#344a78; --f6:#6f7b96; --s1:#1d2436; --s2:#3a3424; --s3:#5e4a26; --s4:#8a5e28; --s5:#c27a35; --s5-ink:#140a02; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.04em;font-size:15px;white-space:nowrap}
.brand .ver{display:inline-block;font:600 11px/1 var(--num);letter-spacing:.02em;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:3px 6px;vertical-align:2px;margin-left:4px}
.brand small{display:block;font-weight:400;color:var(--ink3);font-size:11px;letter-spacing:.08em}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--ink2);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.top-meta{margin-left:auto;color:var(--ink3);font-size:12px;text-align:right}
.preview-tag{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 6px;font-size:11px;margin-left:6px}

main{max-width:1320px;margin:0 auto;padding-block:18px 60px;padding-inline:20px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.panel h2{font-size:15px;margin:0;text-wrap:balance}
.panel-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hint{color:var(--ink3);font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}

/* scope bar */
.scope{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:12px;color:var(--ink3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip.all[aria-pressed="true"]{background:var(--ink2);border-color:var(--ink2);color:var(--panel)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);display:inline-flex;align-items:center}
.chip .x{border:0;background:none;margin-left:4px;padding:0 2px;color:var(--ink3);font-size:15px;line-height:1}
.search{border:1px dashed var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--panel);min-width:200px;flex:1 1 200px;max-width:320px}
/* groups */
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.grp-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.grp-h b{font-size:14px}
.badge{font-size:11px;border-radius:4px;padding:0 5px;white-space:nowrap}
.badge.up{background:var(--r1);color:var(--ink)} .badge.down{background:var(--g1);color:var(--ink)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.spark{width:100%;height:38px;display:block}
.spark .b-main{fill:var(--c-main)} .spark .b-sub{fill:var(--c-sub)} .spark .b-low{fill:var(--c-low)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:12px;color:var(--ink3)}
.kpi .v{font-size:24px;font-weight:600;line-height:1.2}
.kpi .s{font-size:12px;color:var(--ink2)}
.kpi.alert .v{color:var(--warn)}
.up{color:var(--r2)} .down{color:var(--g2)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font-size:11px;font-family:var(--num)}
.chart .lbl{fill:var(--ink2)}
.chart .b-main{fill:var(--c-main)} .chart .b-sub{fill:var(--c-sub)} .chart .b-low{fill:var(--c-low)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.ln{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:3px;margin-right:5px}

/* band × flow table */
.tw{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:3px;min-width:100%;font-size:13px}
.heat th{font-weight:500;color:var(--ink2);text-align:center;padding:4px 6px;white-space:nowrap}
.heat th.rowh{text-align:left;font-weight:600;color:var(--ink);position:sticky;left:0;background:var(--panel);z-index:1;min-width:92px}
.heat thead th{vertical-align:bottom}
.bandh{display:flex;flex-direction:column;gap:3px;align-items:stretch;min-width:84px}
.bandh .bl{font-weight:600;color:var(--ink)}
.bandh .bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.bandh .bar i{display:block;height:100%}
.cls{font-size:11px;border-radius:4px;padding:0 5px;align-self:center}
.cls.main{background:var(--c-main);color:var(--panel)} .cls.sub{background:var(--c-sub);color:#fff} .cls.low{background:var(--c-low);color:var(--ink2)}
td.c{border-radius:6px;padding:6px 8px;text-align:center;cursor:pointer;color:var(--cell-ink);min-width:84px;position:relative}
td.c .a{font-size:15px;font-weight:600;display:block}
td.c .m{font-size:11px;opacity:.75}
td.c.g2{background:var(--g2);color:var(--g2-ink)} td.c.g1{background:var(--g1)} td.c.n0{background:var(--n0)} td.c.r1{background:var(--r1)} td.c.r2{background:var(--r2);color:var(--r2-ink)}
td.c.s1{background:var(--s1)} td.c.s2{background:var(--s2)} td.c.s3{background:var(--s3)} td.c.s4{background:var(--s4)} td.c.s5{background:var(--s5);color:var(--s5-ink)}
td.c .dv{position:absolute;top:2px;right:4px;font-size:10px;font-weight:700;line-height:1}
td.c .dv.up{color:var(--r2)} td.c .dv.down{color:var(--g2)}
td.c.s5 .dv.up,td.c.r2 .dv.up{color:var(--s5-ink)}
td.c.small{background:repeating-linear-gradient(135deg,var(--n0) 0 6px,transparent 6px 10px);color:var(--ink3)}
td.c.empty{cursor:default;color:var(--ink3);background:none}
td.c:hover:not(.empty){outline:2px solid var(--accent)}
td.c.mainc::after{content:"";position:absolute;left:6px;right:6px;bottom:2px;height:2px;border-radius:2px;background:var(--c-main);opacity:.9}
td.tot{color:var(--ink2);text-align:right;padding:4px 8px;white-space:nowrap}
tr.foot th,tr.foot td{border-top:1px solid var(--line)}
.more{border:0;background:none;color:var(--accent);padding:6px 0;font-size:13px}

/* insight list */
.insights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ins{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ins b{font-size:13px}
.ins p{margin:0;color:var(--ink2);font-size:13px}
.ins.warn{border-color:var(--warn);background:var(--warn-soft)}

/* comparison */
.cmp-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
table.list{border-collapse:collapse;width:100%;font-size:13px}
.list th{font-weight:500;color:var(--ink3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.list th:first-child,.list td:first-child{text-align:left}
.list tr.click{cursor:pointer} .list tr.click:hover td{background:var(--accent-soft)}
.best{color:var(--g2);font-weight:600} .worst{color:var(--r2);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.mix{display:flex;height:16px;border-radius:4px;overflow:hidden;min-width:160px}
.mix i{display:block;height:100%}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(10,20,40,.12);z-index:40;padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.drawer h3{margin:0;font-size:16px}
.xbtn{position:absolute;right:14px;top:12px;border:0;background:none;font-size:20px;color:var(--ink3)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden}
.stack i{display:block;height:100%}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:13px}
.kv span:nth-child(3n+2),.kv span:nth-child(3n){text-align:right}

/* quote */
.qbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.qbar input[type=text],.qbar input[type=number],.qbar select{border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--panel);min-width:0}
.qbar input[type=number]{width:90px}
table.quote{border-collapse:separate;border-spacing:3px;font-size:13px;min-width:100%}
.quote th{font-weight:500;color:var(--ink2);padding:4px 6px;white-space:nowrap}
.quote td{padding:4px 6px;border-radius:6px;background:var(--n0);text-align:center;min-width:96px}
.quote td.ref{background:repeating-linear-gradient(135deg,var(--n0) 0 6px,transparent 6px 10px);border:1px dashed var(--line)}
.quote td.none{background:none;color:var(--ink3)}
.quote td.edited{box-shadow:inset 0 0 0 2px var(--warn)}
.quote td.loss{box-shadow:inset 0 0 0 2px var(--r2)}
.quote input{width:64px;border:1px solid var(--line);border-radius:5px;padding:3px 4px;text-align:center;background:var(--panel);font-family:var(--num);font-size:15px;font-weight:600}
.quote small{display:block;font-size:11px;color:var(--ink3)}
.tag{font-size:10px;border-radius:3px;padding:0 4px;background:var(--line);color:var(--ink2)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.drawer>*{flex-shrink:0}
.drawer.sim{width:min(560px,100%)}
.sim-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sim-row{display:grid;grid-template-columns:auto minmax(0,1fr) 92px;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line2)}
.sim-row.on{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.sim-body{min-width:0;font-size:13px}.sim-params{margin-top:4px;color:var(--ink2);font-size:12px;line-height:2}
.sim-eff{text-align:right;font-size:14px;font-weight:600}.sim-eff small{font-size:11px;font-weight:400;margin-left:2px}
/* v3.2 refinements: plain-language tips, period deltas, combobox, finance tables */
.tip{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line);color:var(--ink3);font:600 10px/1 var(--num);cursor:help;margin-left:3px;vertical-align:1px}
.tip:hover,.tip:focus{border-color:var(--accent);color:var(--accent)}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink2)}
.kpi .delta{font-size:12px;color:var(--ink3);border-top:1px dashed var(--line2);padding-top:4px;margin-top:4px}
.kpi .delta .up{color:var(--r2)} .kpi .delta .down{color:var(--g2)}
.combo{position:relative;flex:1 1 220px;max-width:340px}
.combo .search{width:100%;max-width:none}
.combo-list{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;min-width:300px;max-height:360px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(10,20,40,.14);padding:4px}
.combo-list .opt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.combo-list .opt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-list .opt .meta{color:var(--ink2);font-size:12px}
.combo-list .opt .tag{font-size:11px;color:var(--ink3);background:var(--line2);border-radius:4px;padding:1px 6px;white-space:nowrap}
.combo-list .opt.active,.combo-list .opt:hover{background:var(--accent-soft)}
.combo-list mark{background:none;color:var(--accent);font-weight:700}
.combo-list .more-hint{padding:8px 10px;font-size:12px;color:var(--ink3)}
.bandh .bw{font-size:11px;color:var(--ink3)}
.hbar{display:grid;grid-template-columns:76px minmax(0,1fr) 92px;gap:8px;align-items:center;padding:3px 0;font-size:12px}
.hbar .hb{display:flex;flex-direction:column;gap:2px}
.hbar .hb i{display:block;height:7px;border-radius:2px;min-width:1px}
.hbar .hb i.prev{background:var(--c-low)} .hbar .hb i.cur{background:var(--c-main)}
.hbar .hv{text-align:right} .hbar small{font-size:11px;margin-left:4px}
table.fin th{font-size:12px} table.fin td,table.fin th{padding:7px 10px}
table.list tr.total td{border-top:1.5px solid var(--ink3);font-weight:600;background:var(--line2)}
.list th{color:var(--ink3);font-weight:500;letter-spacing:.02em}
.list td.num,.list th:not(:first-child){font-variant-numeric:tabular-nums}
.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 24px;font-size:13px}
.about b{display:block;font:600 15px var(--num)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:8px;z-index:60;font-size:13px}

/* settings */
.set-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--ink2)}
.drop b{color:var(--ink);font-size:15px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.row:last-child{border-bottom:0}
.switch{width:36px;height:20px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)} .switch[aria-checked="true"]::after{left:19px}
.stepchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;margin:0 6px 6px 0}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.insights,.cmp-grid,.set-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.top-meta{margin-left:0;text-align:left}main{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">出港成本分析 <span class="ver" title="发布 2026-10-13 · 数据版本 7">v3.2.0</span><small>OUTBOUND COST STUDIO</small></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-page="analysis" aria-selected="true">成本分析</button>
    <button role="tab" data-page="quote" aria-selected="false">报价</button>
    <button role="tab" data-page="data" aria-selected="false">数据与设置</button>
  </nav>
  <div class="top-meta" id="topMeta"></div>
</div></header>
<main id="app"></main>
<div id="drawer" hidden></div>
<script src="data.js"></script>
<script src="history.js"></script>
<script>

function smartBands(d,expand){
  const tot=d.reduce((s,x)=>s+x.n,0)||1;
  const b05=[];for(let b=1;b<=12;b++){const units=[];for(let u=(b-1)*5+1;u<=Math.min(b*5,60);u++)units.push(u);if(b===12)for(let u=56;u<=60;u++)if(!units.includes(u))units.push(u);
    b05.push({lo:(b-1)*.5,hi:b===12?99:b*.5,units,n:units.reduce((s,u)=>s+d[u].n,0)})}
  let i=0,j=b05.length-1;
  while(i<j&&b05[i].n/tot<.02)i++;
  while(j>i&&b05[j].n/tot<.02)j--;
  const out=[];
  if(i>0){const m=b05.slice(0,i);out.push({lo:0,hi:b05[i-1].hi,units:m.flatMap(x=>x.units),n:m.reduce((s,x)=>s+x.n,0),merged:'low'})}
  for(let k=i;k<=j;k++)out.push({...b05[k]});
  if(j<b05.length-1){const m=b05.slice(j+1);out.push({lo:b05[j+1].lo,hi:99,units:m.flatMap(x=>x.units),n:m.reduce((s,x)=>s+x.n,0),merged:'high'})}
  for(const b of out){b.share=b.n/tot;b.cls=b.share>=.4?'main':b.share>=.1?'sub':'low';b.label=b.merged==='low'?`≤${b.hi}kg`:b.hi>=99?`${b.lo}kg以上`:`${b.lo}–${b.hi}kg`}
  if(!expand)return out;
  return out.flatMap(b=>b.cls!=='main'?[b]:b.units.filter(u=>d[u].n>0).map(u=>({lo:(u-1)/10,hi:u/10,units:[u],n:d[u].n,share:d[u].n/tot,cls:'main',fine:true,label:`${((u-1)/10).toFixed(1)}–${(u/10).toFixed(1)}`})));
}

function refFor(cp,np,units){const band=sumUnits(np,units);const ba=k=>band.n?band[k]/band.n:null;const o={n:band.n,fee:0,disp:0,tran:0,mf:0,cn:0};
  for(const u of units){const c=cp?.[u];if(!c||!c.n)continue;const r=np?.[u],ok=r&&r.n>=5;if(!ok&&!band.n)continue;o.cn+=c.n;for(const k of ['fee','disp','tran','mf'])o[k]+=c.n*(ok?r[k]/r.n:ba(k))}
  if(!o.cn)return {n:band.n,avg:null};return {n:band.n,avg:o.fee/o.cn,disp:o.disp/o.cn,tran:o.tran/o.cn,mf:o.mf/o.cn}}
function b05Units(b){const u=[];for(let x=(b-1)*5+1;x<=Math.min(b*5,60);x++)u.push(x);return u}
function equivalent(cb){ // network cost for the same province × 0.1kg mix
  let n=0,e=0;for(const p in cb)for(let b=1;b<=12;b++){const units=b05Units(b),c=sumUnits(cb[p],units);if(!c.n)continue;const r=refFor(cb[p],NET[p],units);if(r.avg!=null){n+=c.n;e+=c.n*r.avg}}
  return n?e/n:null}
function critical(cb){ // tickets within 0.1kg above a billing step, valued with same-province network jump
  let n=0,save=0,detail=[];
  for(const [s] of S.steps){const u=Math.round(s*10)+1;let sn=0,ss=0;
    for(const p in cb){const x=cb[p][u];if(!x)continue;const hi=NET[p]?.[u],lo=NET[p]?.[u-1];
      const j=(hi&&lo&&hi.n>=10&&lo.n>=10)?hi.fee/hi.n-lo.fee/lo.n:(S.steps.find(z=>z[0]===s)[1]);sn+=x.n;ss+=x.n*Math.max(0,j)}
    n+=sn;save+=ss;detail.push({step:s,n:sn,save:ss})}
  return {n,save,detail}}

function itemPerU(k,u,K){const m=st.sim[k];if(!m.on)return 0;u=+u;

function simAdj(cp,units,K,only){let a=0;if(!cp)return 0;for(const u of units){const x=cp[u];if(!x)continue;for(const k of only||PER_U_KEYS)a+=x.n*itemPerU(k,u,K);

function shape(s){ // weight shares by 0.5kg band, flow shares by province, plus readable class labels
  const tot=s.t.n,wb=new Array(13).fill(0);for(let u=1;u<=60;u++)wb[Math.min(12,Math.ceil(u/5))]+=s.d[u].n/tot;
  const fp={};for(const p in s.cb)fp[p]=total({[p]:s.cb[p]}).n/tot;
  const rs={};for(const p in fp){const r=regionOf(S.provinces[p]);rs[r]=(rs[r]||0)+fp[p]}
  const bl=b=>b===1?'≤0.5kg':`${(b-1)*.5}–${b*.5}kg`;let top=1;for(let b=2;b<=12;b++)if(wb[b]>wb[top])top=b;
  let wlabel;if(wb[top]>=.6)wlabel=bl(top)+' 集中';else{let best=0,bi=1;for(let b=1;b<12;b++)if(wb[b]+wb[b+1]>best){best=wb[b]+wb[b+1];bi=b}wlabel=best>=.7?`${(bi-1)*.5}–${(bi+1)*.5}kg 双主要`:'重量分散'}
  const tp=Object.keys(fp).sort((a,b)=>fp[b]-fp[a]),tr=Object.keys(rs).sort((a,b)=>rs[b]-rs[a]);
  let tilt=null,tv=0;for(const r in rs){const d=rs[r]-(NETR[r]||0);if(d>tv){tv=d;tilt=r}}
  const flabel=fp[tp[0]]>=.35?short(S.provinces[tp[0]])+'为主':tv>=FLOW_TILT?'偏'+tilt:'流向均衡';

function nice(lo,hi,count=4){const raw=(hi-lo)/count,mag=10**Math.floor(Math.log10(raw)),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step;const t=[];for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));return {lo:a,hi:b,ticks:t}}
function rangeU(d){const tot=d.reduce((s,x)=>s+x.n,0);let c=0;for(let u=1;u<=60;u++){c+=d[u].n;if(c>=tot*.995)return Math.max(20,Math.min(60,Math.ceil((u+2)/5)*5))}return 30}
function distChart(d,netd,bands,opts={}){
  const W=1180,H=300,L=46,R=52,T=24,B=40,maxU=opts.maxU||rangeU(d);
  const iw=W-L-R,ih=H-T-B,bw=iw/maxU;
  const tot=d.reduce((s,x)=>s+x.n,0)||1, shares=d.map(x=>st.unit==='share'?x.n/tot:x.n);
  const sy=nice(0,Math.max(...shares.slice(1,maxU+1)),4),ymax=sy.hi;
  const yl=v=>st.unit==='share'?+(v*100).toFixed(1)+'%':v>=10000?+(v/10000).toFixed(1)+'万':int(v);
  const costs=[];for(let u=1;u<=maxU;u++){if(d[u].n>=30)costs.push(d[u].fee/d[u].n);if(netd[u].n>=30)costs.push(netd[u].fee/netd[u].n)}
  const cy=nice(Math.min(...costs),Math.max(...costs),4),cmin=cy.lo,cmax=cy.hi;
  const x=u=>L+(u-1)*bw, ys=v=>T+ih-(v/ymax)*ih, yc=v=>T+ih-((v-cmin)/(cmax-cmin))*ih;
  let g='';
  for(const v of sy.ticks){const y=ys(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line2)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${yl(v)}</text>`}
  for(const c of cy.ticks)g+=`<text x="${W-R+6}" y="${yc(c)+4}">${c.toFixed(2)}</text>`;
  for(let u=1;u<=maxU;u++){const b=bandOf(bands,u),cls=b>=0?bands[b].cls:'low',h=ih-(ys(shares[u])-T);
    g+=`<rect x="${x(u)+1}" y="${ys(shares[u])}" width="${bw-2}" height="${Math.max(0,h)}" class="b-${cls}" rx="2"><title>${((u-1)/10).toFixed(1)}–${(u/10).toFixed(1)}kg：${int(d[u].n)}票，占${pct(d[u].n/tot)}${d[u].n?'，单票'+fmt(d[u].fee/d[u].n)+'元':''}</title></rect>`;
    if(u%5===0)g+=`<text x="${x(u)+bw}" y="${H-B+16}" text-anchor="middle">${(u/10).toFixed(1)}</text>`}
  g+=`<text x="${L}" y="${H-B+16}" text-anchor="middle">0</text><text x="${W-R}" y="${H-6}" text-anchor="end" class="lbl">结算重量 kg</text>`;
  for(const [s,j] of S.steps){if(s*10>maxU)continue;const xx=L+s*10*bw;g+=`<line x1="${xx}" x2="${xx}" y1="${T-6}" y2="${T+ih}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="${xx+4}" y="${T+4}" style="fill:var(--warn)">档位 ${s}kg · +${j.toFixed(2)}元</text>`}
  const line=(dd,minN)=>{let p='',prev=-9;for(let u=1;u<=maxU;u++){if(dd[u].n<minN)continue;p+=(u===prev+1?'L':'M')+(x(u)+bw/2).toFixed(1)+','+yc(dd[u].fee/dd[u].n).toFixed(1);prev=u}return p};
  if(!isAll())g+=`<path d="${line(netd,30)}" fill="none" stroke="var(--ink3)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  g+=`<path d="${line(d,30)}" fill="none" stroke="var(--r2)" stroke-width="2.2"/>`;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="重量分布与单票成本">${g}</svg>`}

function overlayChart(list,maxU=Math.max(...list.map(s=>rangeU(s.d)))){
  const W=1180,H=260,L=46,R=20,T=18,B=36,iw=W-L-R,ih=H-T-B,bw=iw/maxU;
  const series=list.map(s=>{const tot=s.t.n;return s.d.map(x=>x.n/tot)});
  const sy=nice(0,Math.max(...series.flatMap(a=>a.slice(1,maxU+1))),4),ymax=sy.hi;
  const x=u=>L+(u-.5)*bw,y=v=>T+ih-(v/ymax)*ih;let g='';
  for(const v of sy.ticks)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${+(v*100).toFixed(1)}%</text>`;
  for(let u=5;u<=maxU;u+=5)g+=`<text x="${L+u*bw}" y="${H-B+16}" text-anchor="middle">${(u/10).toFixed(1)}</text>`;
  for(const [s] of S.steps){if(s*10>maxU)continue;const xx=L+s*10*bw;g+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${T+ih}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="${xx+4}" y="${T+10}" style="fill:var(--warn)">${s}kg</text>`}
  list.forEach((s,k)=>{let p='';for(let u=1;u<=maxU;u++)p+=(p?'L':'M')+x(u).toFixed(1)+','+y(series[k][u]).toFixed(1);g+=`<path d="${p}" fill="none" stroke="${colorOf(s.i)}" stroke-width="2.2"/>`});
  g+=`<text x="${W-R}" y="${H-4}" text-anchor="end" class="lbl">结算重量 kg</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="客户重量分布对比">${g}</svg>`}

function waterfall(steps){ // [{label,v,kind:'base'|'delta'|'end'}]
  const W=560,H=250,L=44,R=12,T=16,B=48,iw=W-L-R,ih=H-T-B;
  let run=0;const bars=steps.map(s=>{if(s.kind==='base'){run=s.v;return {...s,a:0,b:s.v}}if(s.kind==='end')return {...s,a:0,b:s.v};const a=run;run+=s.v;return {...s,a,b:run}});
  const vals=bars.flatMap(b=>b.kind==='delta'?[b.a,b.b]:[b.b]);const ax=nice(Math.max(0,Math.min(...vals)-.3),Math.max(...vals),4),vmin=ax.lo,hi=ax.hi;
  const y=v=>T+ih-((v-vmin)/(hi-vmin))*ih,bw=iw/bars.length;let g='';
  for(const v of ax.ticks)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v.toFixed(2)}</text>`;
  bars.forEach((b,k)=>{const top=y(Math.max(b.a,b.b)),bot=y(b.kind==='delta'?Math.min(b.a,b.b):vmin);const col=b.kind!=='delta'?'var(--c-sub)':b.v>=0?'var(--r2)':'var(--g2)';
    g+=`<rect x="${L+k*bw+bw*.18}" y="${top}" width="${bw*.64}" height="${Math.max(1,bot-top)}" fill="${col}" rx="3"/>`;
    const t=b.kind==='delta'?(b.v>=0?'+':'')+b.v.toFixed(3):b.v.toFixed(3);
    g+=`<text x="${L+k*bw+bw/2}" y="${top-5}" text-anchor="middle" class="lbl">${t}</text><text x="${L+k*bw+bw/2}" y="${H-B+16}" text-anchor="middle" class="lbl">${esc(b.label)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="成本差异分解">${g}</svg>`}

/* ---------- comparison math ---------- */
function decompose(A,Bcb){ // avgA − avgB = weight structure + flow structure + same-cell price, priced with network (province × 0.1kg)
  const r=(p,u)=>{const x=NET[p]?.[u];if(x&&x.n>=5)return x.fee/x.n;const b=netCell(p,b05Units(Math.min(12,Math.ceil(u/5))));return b.n?b.fee/b.n:null};
  const scan=cb=>{let n=0,fee=0,E=0;const byU={},rU={};for(const p in cb)for(const u in cb[p]){const c=cb[p][u],rr=r(p,u);if(!c.n||rr==null)continue;n+=c.n;fee+=c.fee;E+=c.n*rr;byU[u]=(byU[u]||0)+c.n;rU[u]=(rU[u]||0)+c.n*rr}return {n,avg:fee/n,E:E/n,byU,rU}};
  const a=scan(A),b=scan(Bcb);
  const uRate=u=>b.rU[u]!=null?b.rU[u]/b.byU[u]:(()=>{let n=0,e=0;for(const p in NET){const x=NET[p][u];if(x){n+=x.n;e+=x.fee}}return n?e/n:0})();
  let wMix=0;for(const u in a.byU)wMix+=a.byU[u]/a.n*uRate(u);
  return {avgA:a.avg,avgB:b.avg,weight:wMix-b.E,flow:a.E-wMix,price:(a.avg-a.E)-(b.avg-b.E)}}

  const spec=S.K.filter(r=>st.sel.has(r[0])).reduce((s,r)=>s+r[2],0);

  const kpis=`<section class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <div class="kpi"><span class="k">正常件票数</span><span class="v num">${int(t.n)}</span><span class="s">${esc(selName().length>14?st.sel.size+' 个客户':selName())}</span>${dl(hp?chg(hc.n,hp.n):'')}</div>
    <div class="kpi"><span class="k">日均发件量 ${tip(isAll()?'票数 ÷ 统计天数（自然日）':'票数 ÷ 有发货的天数')}</span><span class="v num">${int(t.n/days)}</span><span class="s">${isAll()?`统计 ${NDAYS} 天`:`发货 ${days}/${NDAYS} 天`}</span>${dl(hp&&hp.days?chg(hc.n/hc.days,hp.n/hp.days):'')}</div>
    <div class="kpi"><span class="k">平均结算重量</span><span class="v num">${fmt(t.w/t.n,2)}<small> kg</small></span><span class="s">主要重量 ${mainB.map(b=>b.label).join('、')||'—'}</span>${dl(hp?chg(hc.w/hc.n,hp.w/hp.n,'abs')+' kg':'')}</div>
    <div class="kpi"><span class="k">单票实际成本 ${tip('账单费用 ± 已开启的成本模拟项，元/票')}</span><span class="v num">${fmt(avg,3)}</span><span class="s">${simCount()?`账单 ${fmt(t.fee/t.n,3)} · 模拟 ${R>0?'−':'+'}${fmt(Math.abs(R)/t.n,3)}（${simCount()} 项）`:'账单费用，未开模拟项'}</span>${dl(hp?chg(hc.fee/hc.n,hp.fee/hp.n,'abs')+' 元（账单）':'')}</div>
    <div class="kpi"><span class="k">网点同类件成本 ${tip('按这个客户的目的地和重量分布，换成网点平均价算出的单票成本')}</span><span class="v num">${isAll()?'—':fmt(eq,3)}</span><span class="s">${isAll()?'当前即网点汇总':'同流向同重量段网点均价'}</span></div>
    <div class="kpi"><span class="k">比网点贵 / 便宜 ${tip('同目的地、同重量的件，比网点平均每票贵（+）或便宜（−）多少，按账单费用比较')}</span><span class="v num ${gap>0.005?'up':gap<-0.005?'down':''}">${isAll()?'—':(gap>=0?'+':'')+fmt(gap,3)}</span><span class="s">${isAll()?'—':gap>0.005?'比网点贵':gap<-0.005?'比网点便宜':'与网点持平'}</span></div>
    <div class="kpi"><span class="k">退改率 ${tip('拦截、退件、退改的票数 ÷ 全部票数')}</span><span class="v num ${ret.rate>net.rate*1.5?'up':''}">${pct(ret.rate,2)}</span><span class="s">网点 ${pct(net.rate,2)} · 附加 ${fmt(ret.total/t.n,3)} 元/票</span></div>

  </section>`;
  // insights

    <div class="ins"><b>${isAll()?'网点汇总视图':Math.abs(gap)<0.03?'价格与网点基本一致':gap>0?'同条件价差高于网点':'同条件价差低于网点'}</b><p>${isAll()?`共 ${int(t.n)} 票，另有 ${int(spec)} 票特殊件已隔离。`:`成本差异主要来自重量和流向结构；同流向同重量段单价差 ${(gap>=0?'+':'')+fmt(gap,3)} 元/票。已隔离特殊件 ${int(spec)} 票。`}</p></div>
  </section>`;

  const chart=`<section class="panel"><div class="panel-head"><h2>重量分布与成本</h2><span class="hint">每根柱 0.1kg；颜色表示所在重量段的集中程度</span><div class="seg" style="margin-left:auto"><button data-unit="share" aria-pressed="${st.unit==='share'}">占比</button><button data-unit="count" aria-pressed="${st.unit==='count'}">票量</button></div></div>${distChart(d,netd,bandsBase)}<div class="legend">${legendCls}</div></section>`;

  if(isAll())return scopeBar()+kpis+ins+historyPanel()+groupPanel()+chart+heat+rankingTable();
  return scopeBar()+kpis+ins+historyPanel()+afterSalesPanel()+similarPanel([...st.sel][0])+chart+heat}

function heatTable(cb,bands,t){const K=simConst(),addonPer=st.sim.addon.on&&t.n?retOf(st.sel).total/total(cb).n:0;
  const city=st.level==='city';
  let rowsData=[];
  if(!city){for(const p in cb){const cells=bands.map(b=>({c:withSim(sumUnits(cb[p],b.units),cb[p],b.units,K,addonPer),r:refFor(cb[p],NET[p],b.units)}));const tot=cells.reduce((s,x)=>s+x.c.n,0);if(tot)rowsData.push({key:p,name:S.provinces[p],cells,tot,fee:cells.reduce((s,x)=>s+x.c.fee,0)})}}
  else{const cc=cityCube(st.sel);for(const k in cc){const cells=bands.map(b=>({c:withSim(sumUnits(cc[k],b.units),cc[k],b.units,K,addonPer),r:refFor(cc[k],CITYNET[k],b.units)}));const tot=cells.reduce((s,x)=>s+x.c.n,0);if(tot)rowsData.push({key:k,name:S.cities[k].split('/')[1]+'<small style="color:var(--ink3);font-weight:400"> '+S.cities[k].split('/')[0].replace(/省|自治区|壮族|回族|维吾尔/g,'')+'</small>',cells,tot,fee:cells.reduce((s,x)=>s+x.c.fee,0)})}}
  rowsData.sort((a,b)=>b.tot-a.tot);
  const limit=st.showAll?rowsData.length:12,shown=rowsData.slice(0,limit),rest=rowsData.slice(limit);
  const allAvgs=rowsData.flatMap(r=>r.cells.filter(x=>x.c.n>=30).map(x=>x.c.fee/x.c.n)).sort((a,b)=>a-b);
  const qv=k=>allAvgs.length?allAvgs[Math.min(allAvgs.length-1,Math.floor(k*allAvgs.length))]:0,cuts=[qv(.2),qv(.4),qv(.6),qv(.8)];
  const costLevel=v=>'s'+(1+cuts.filter(c=>v>=c).length);
  const cell=(x,j,rowKey)=>{const {c,r}=x;if(!c.n)return `<td class="c empty">·</td>`;const a=c.fee/c.n,ra=r.avg;
    const dev=!isAll()&&ra&&c.n>=30&&r.n>=30?(c.sys/c.n)/ra-1:null;
    const k=c.n<30?'small':st.colorMode==='network'&&!isAll()?costClass(c.sys/c.n,ra,c.n,r.n):costLevel(a);
    const badge=dev!=null&&Math.abs(dev)>=.02&&st.colorMode==='cost'?`<span class="dv ${dev>0?'up':'down'}">${dev>0?'▲':'▼'}${Math.abs(dev*100).toFixed(0)}%</span>`:'';
    const tip=`${c.n}票 · 单票 ${fmt(a,3)} 元`+(isAll()||!ra?'':` · 网点同类件 ${fmt(ra,3)} 元（${a>=ra?'+':''}${pct(a/ra-1)}）`)+(c.n<30?' · 样本少于30票':'');
    return `<td class="c ${k} ${bands[j].cls==='main'?'mainc':''}" data-row="${esc(rowKey)}" data-band="${j}" title="${tip}">${badge}<span class="a num">${fmt(a,2)}</span><span class="m num">${cellSub(c,t.n)}</span></td>`};
  const colW=bands.map(b=>{let n=0,w=0;for(const p in cb){const x=sumUnits(cb[p],b.units);n+=x.n;w+=x.w}return n?w/n:null});
  const head=`<tr><th class="rowh">${city?'城市':'流向'}</th>${bands.map((b,bi)=>`<th><div class="bandh"><span class="bl num">${b.label}</span><span class="bw num">均重 ${colW[bi]!=null?fmt(colW[bi],2)+'kg':'—'}</span><span class="cls ${b.cls}">${b.cls==='main'?'主要':b.cls==='sub'?'次要':'少量'} ${pct(b.share,0)}</span><div class="bar"><i style="width:${Math.min(100,b.share*100/ Math.max(...bands.map(x=>x.share))*100/100)}%;background:var(--c-${b.cls})"></i></div></div></th>`).join('')}<th>合计</th></tr>`;
  const body=shown.map(r=>`<tr><th class="rowh">${r.name}</th>${r.cells.map((x,j)=>cell(x,j,r.key)).join('')}<td class="tot num">${fmt(r.fee/r.tot,2)}<br><span class="hint">${qty(r.tot,t.n)}</span></td></tr>`).join('');
  let foot='';
  if(rest.length){const agg=bands.map((_,j)=>rest.reduce((a,r)=>{a.n+=r.cells[j].c.n;a.fee+=r.cells[j].c.fee;return a},{n:0,fee:0}));const tn=agg.reduce((s,x)=>s+x.n,0);
    foot+=`<tr><th class="rowh">其余 ${rest.length} 个</th>${agg.map(a=>a.n?`<td class="c n0" style="cursor:default"><span class="a num">${fmt(a.fee/a.n,2)}</span><span class="m num">${qty(a.n,t.n)}</span></td>`:'<td class="c empty">·</td>').join('')}<td class="tot num">${fmt(rest.reduce((s,r)=>s+r.fee,0)/tn,2)}<br><span class="hint">${qty(tn,t.n)}</span></td></tr>`}

     <div class="kpi ${loss?'alert':''}"><span class="k">低于成本</span><span class="v num">${loss}</span><span class="s">红框格子需要确认</span></div></section>
   <section class="panel"><div class="panel-head"><h2>报价表 · ${esc(q.target||selName().split('、')[0])}</h2><span class="hint">元/票，保留 1 位小数 · 报价覆盖全部重量，深色标签为该客户主要重量 · 斜纹格样本不足 30 票：先按网点同流向同重量段成本，再不足按全网同重量段成本</span></div>
   <div class="tw"><table class="quote"><thead><tr><th style="text-align:left">流向</th>${bands.map(b=>`<th><span class="num">${b.label}</span><br><span class="cls ${b.cls}">${pct(b.share,0)}</span></th>`).join('')}</tr></thead><tbody>${rows.slice(0,st.showAllQ?99:14).map(r=>`<tr><th style="text-align:left">${S.provinces[r.p]}</th>${r.cells.map(td).join('')}</tr>`).join('')}</tbody></table></div>
   <button class="more" id="moreQ">${st.showAllQ?'只看前 14 个流向':'展开全部 '+rows.length+' 个流向'}</button>
   <p class="hint">导出给客户的 Excel 只有流向、重量段和报价，不含成本、毛利和其他客户信息。</p></section>
   <section class="panel"><div class="panel-head"><h2>已保存的报价</h2></div><p class="hint">还没有保存过报价。保存后在这里按客户查看、再次导出。</p></section>`}

/* ---------- data & settings ---------- */
function dataPage(){
  const kinds={invalid:'没有金额 / 缺目的地',noweight:'全程无重',self:'自发自签',return:'退件 / 拦截 / 退改'};
  const kc={};for(const r of S.K)kc[r[1]]=(kc[r[1]]||0)+r[2];
  const sw=(id,label,n)=>`<div class="row"><span>${label}<br><span class="hint">${int(n||0)} 票</span></span><button class="switch" role="switch" data-sw="${id}" aria-checked="${st.switches[id]}" aria-label="${label}"></button></div>`;

  const about=`<section class="panel"><div class="panel-head"><h2>关于</h2><span class="hint">出港成本分析 · 开源项目</span></div><div class="about"><div><span class="hint">当前版本</span><b>v3.2.0</b></div><div><span class="hint">发布日期</span><b>2026-10-13</b></div><div><span class="hint">数据版本</span><b>7</b></div><div><span class="hint">库内记录</span><b>${int(S.rows)}</b></div><div><span class="hint">历史版本</span><b style="font-size:13px">v3.1.0 成本模拟 · v3.0.0 简化版</b></div></div></section>`;
  return `<section class="set-grid">
   <div class="panel"><div class="panel-head"><h2>导入账单</h2></div>
     <div class="drop"><b>把出港账单 Excel 拖到这里</b><br>可一次放多个文件：单个客户、几个客户或整个网点都可以；同一运单不会重复计算</div>
     <div style="margin-top:14px" class="row"><span><b>${esc(S.file)}</b><br><span class="hint">寄件 ${S.dates[0]} 至 ${S.dates[1]}</span></span><span class="num" style="text-align:right">${int(S.rows)} 行<br><button class="more" style="padding:0">撤销这次导入</button></span></div>
     <div class="row"><span>包含 ${NC} 个客户</span><span class="hint">${STATS.slice(0,6).map(x=>esc(x.name)).join('、')} 等</span></div>
     <p class="hint">同一运单再次导入时以最新导入的账单为准；如需逐条核对，可在“冲突记录”里处理。</p></div>
   <div class="panel"><div class="panel-head"><h2>重量段</h2></div>
     <div class="row"><span>基础区间宽度</span><div class="seg"><button aria-pressed="false">0.25kg</button><button aria-pressed="true">0.5kg</button><button aria-pressed="false">1kg</button></div></div>
     <div class="row"><span>主要重量 / 次要段门槛</span><span class="num">≥40% / ≥10%</span></div>
     <div class="row"><span>两端合并门槛</span><span class="num">占比 &lt; 2% 的段并入“以下 / 以上”</span></div>
     <div class="row"><span>计费档位（从账单自动识别，可修改）</span><span>${S.steps.map(([s,j])=>`<span class="stepchip num">${s}kg <span class="hint">+${j.toFixed(2)}元</span></span>`).join('')}</span></div>
   </div>
   <div class="panel"><div class="panel-head"><h2>不计入客户成本的件</h2><span class="hint">本次导入中的票数</span></div>
     ${sw('no_fee','没有金额 / 缺目的地',kc.invalid)}${sw('no_weight','全程无重（按默认重计费）',kc.noweight)}${sw('self_sign','自发自签',kc.self)}${sw('return','退件 / 拦截 / 退改（增值费用）',kc.return)}</div>
   <div class="panel"><div class="panel-head"><h2>成本模拟默认值</h2><span class="hint">在成本分析页“成本模拟”中调整并保存</span></div>
     ${SIM_META.map(([k,label])=>`<div class="row"><span>${label}</span><span class="num ${st.sim[k].on?'':'hint'}">${st.sim[k].on?'开启':'关闭'}${st.sim[k].v!=null?' · '+st.sim[k].v:''}</span></div>`).join('')}</div>
  </section>${about}`}

/* ---------- render & events ---------- */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.page===st.page));
  $('#topMeta').innerHTML=`数据：寄件 ${S.dates[0]} – ${S.dates[1]} · ${int(NETT.n)} 票正常件<span class="preview-tag">界面预览</span>`;
  $('#app').innerHTML=st.page==='analysis'?analysisPage():st.page==='quote'?quotePage():dataPage();
  if(st.simOpen&&st.page==='analysis'){$('#drawer').hidden=false;$('#drawer').innerHTML=simPanel()}else if(st.simOpen===false&&$('#drawer').querySelector('.sim'))$('#drawer').hidden=true;
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,td.c,tr.click,[data-pick]');if(!t)return;
  if(t.matches('.tabs button')){st.page=t.dataset.page;$('#drawer').hidden=true;render();return}
  if(t.dataset.cust==='all'){st.sel=isAll()?new Set([DEFAULT]):new Set(S.customers.map((_,i)=>i));st.expand=false;render();return}
  if(t.dataset.level){st.level=t.dataset.level;st.showAll=false;render();return}
  if(t.dataset.remove!=null){st.sel.delete(+t.dataset.remove);render();return}
  if(t.dataset.cmpgroup){const g=GROUPS.find(x=>x.key===t.dataset.cmpgroup);st.sel=new Set(g.members.slice(0,MAX_CMP));st.cmpA=null;render();window.scrollTo({top:0});return}
  if(t.dataset.cmpsim){const i=+t.dataset.cmpsim;st.sel=new Set([i,...similarTo(i,4).map(x=>x.s.i)]);st.cmpA=i;render();window.scrollTo({top:0});return}
  if(t.dataset.opengroup){st.openGroup=st.openGroup===t.dataset.opengroup?null:t.dataset.opengroup;render();return}
  if(t.id==='rankMore'){st.rankAll=!st.rankAll;render();return}
  if(t.dataset.sim){const a=t.dataset.sim;if(a==='open')st.simOpen=true;else if(a==='close')st.simOpen=false;else if(a==='reset')st.sim=SIM_DEF();else if(a==='save')toast('正式版：保存为默认（写入设置）');render();return}
  if(t.dataset.simk){st.sim[t.dataset.simk].on=!st.sim[t.dataset.simk].on;render();return}
  if(t.dataset.simtier){st.sim.puhui.v=+t.dataset.simtier;render();return}
  if(t.dataset.csub){st.cellSub=t.dataset.csub;render();return}
  if(t.dataset.cmpp!=null){st.cmpPeriod=t.dataset.cmpp||null;render();return}
  if(t.dataset.pick!=null){pickCustomer(+t.dataset.pick);return}
  if(t.dataset.unit){st.unit=t.dataset.unit;render();return}
  if(t.dataset.color){st.colorMode=t.dataset.color;render();return}
  if(t.id==='expandBtn'){st.expand=!st.expand;render();return}
  if(t.id==='moreBtn'){st.showAll=!st.showAll;render();return}
  if(t.id==='moreQ'){st.showAllQ=!st.showAllQ;render();return}
  if(t.matches('tr.click')){st.sel=new Set([+t.dataset.solo]);render();window.scrollTo({top:0});return}
  if(t.matches('td.c')&&t.dataset.row!=null){openDrawer(t.dataset.row,+t.dataset.band);return}
  if(t.dataset.mode){st.q.mode=t.dataset.mode;st.q.value=t.dataset.mode==='percent'?20:0.3;st.q.over={};render();return}
  if(t.id==='qReset'){st.q.over={};render();return}
  if(t.id==='qExport'){toast('正式版：导出客户报价 Excel（不含成本）');return}
  if(t.id==='qSave'){toast('正式版：保存到“已保存的报价”');return}
  if(t.dataset.sw){st.switches[t.dataset.sw]=!st.switches[t.dataset.sw];t.setAttribute('aria-checked',st.switches[t.dataset.sw]);return}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.simv){const [k,f]=t.dataset.simv.split('.');const v=parseFloat(t.value);if(isFinite(v)&&v>=0){st.sim[k][f]=v;render()}return}
  if(t.id==='cmpA'){st.cmpA=+t.value;render()}else if(t.id==='cmpB'){st.base=t.value;render()}else if(t.id==='cmpBand'){st.cmpBand=t.value;render()}
  else if(t.id==='qAddon'){st.q.addon=t.checked;st.q.over={};render()}
  else if(t.id==='qBasis'){st.q.basis=t.value;st.q.over={};render()}else if(t.id==='qSub'){st.q.sub=t.value.startsWith('一客一价')?'一客一价':'';render()}
  else if(t.id==='qVal'){st.q.value=Math.max(0,+t.value||0);render()}else if(t.id==='qTarget'){st.q.target=t.value.trim();render()}
  else if(t.dataset.q){const v=parseFloat(t.value);if(isFinite(v)&&v>=0)st.q.over[t.dataset.q]=Math.round(v*10)/10;else delete st.q.over[t.dataset.q];render()}});
function pickCustomer(i){if(isAll())st.sel=new Set([i]);else if(!st.sel.has(i)){if(st.sel.size>=MAX_CMP){toast(`最多同时对比 ${MAX_CMP} 个客户`);return}st.sel.add(i)}st.expand=false;render();setTimeout(()=>$('#custSearch')?.focus(),0)}
let comboIdx=0;
function comboRender(q){const box=$('#custList'),inp=$('#custSearch');if(!box)return;q=q.trim();
  const all=STATS.filter(s=>!st.sel.has(s.i)||isAll()).filter(s=>!q||s.name.includes(q)).sort((a,b)=>b.t.n-a.t.n),list=all.slice(0,12);comboIdx=Math.min(comboIdx,Math.max(0,list.length-1));
  const hl=n=>q?esc(n).replace(esc(q),`<mark>${esc(q)}</mark>`):esc(n);
  box.innerHTML=list.length?list.map((s,k)=>`<div class="opt ${k===comboIdx?'active':''}" role="option" aria-selected="${k===comboIdx}" data-pick="${s.i}"><span class="nm">${hl(s.name)}</span><span class="meta num">${int(s.t.n)} 票</span><span class="tag">${s.t.n>=MIN_GROUP_N?esc(s.wlabel):'小客户'}</span></div>`).join('')+(all.length>12?`<div class="more-hint">还有 ${all.length-12} 个，继续输入缩小范围</div>`:''):'<div class="more-hint">没有匹配的客户</div>';
  box.hidden=false;inp.setAttribute('aria-expanded','true')}
document.addEventListener('input',e=>{if(e.target.id==='custSearch'){comboIdx=0;comboRender(e.target.value)}});
document.addEventListener('focusin',e=>{if(e.target.id==='custSearch')comboRender(e.target.value)});
document.addEventListener('focusout',e=>{if(e.target.id==='custSearch')setTimeout(()=>{const b=$('#custList');if(b&&!b.contains(document.activeElement)){b.hidden=true;e.target.setAttribute('aria-expanded','false')}},150)});
document.addEventListener('mousedown',e=>{const o=e.target.closest('[data-pick]');if(o){e.preventDefault();pickCustomer(+o.dataset.pick)}});
document.addEventListener('keydown',e=>{if(e.target.id==='custSearch'){const opts=[...document.querySelectorAll('#custList .opt')];
    if(e.key==='ArrowDown'){comboIdx=Math.min(comboIdx+1,opts.length-1);comboRender(e.target.value);e.preventDefault()}
    else if(e.key==='ArrowUp'){comboIdx=Math.max(comboIdx-1,0);comboRender(e.target.value);e.preventDefault()}
    else if(e.key==='Enter'&&opts[comboIdx]){pickCustomer(+opts[comboIdx].dataset.pick);e.preventDefault()}
    else if(e.key==='Escape'){$('#custList').hidden=true}return}
  if(e.key==='Escape')$('#drawer').hidden=true});
render();
</script>
</body>
</html>
